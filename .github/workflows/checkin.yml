name: GLaDOS Auto Checkin

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check in to GLaDOS
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: node glados-checkin.mjs
